[package]
name = "uf-openapi-examples"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "meta"
path = "src/meta.rs"

[[bin]]
name = "create_note"
path = "src/create_note.rs"

[[bin]]
name = "oauth_pkce"
path = "src/oauth_pkce.rs"

[dependencies]
base64 = "0.22"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
